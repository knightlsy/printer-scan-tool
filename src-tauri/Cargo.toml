[package]
name = "scangate"
version = "4.8.32"
description = "SCAN.GATE 打印机扫描共享工具"
authors = ["knightlsy"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[package.metadata]

[lib]
name = "scangate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scangate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ============ SMB / 网络 ============
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Foundation",
] }
# ============ SQLite 配置 ============
rusqlite = { version = "0.32", features = ["bundled"] }
# ============ HTTP 审计上报 ============
reqwest = { version = "0.12", features = ["json", "blocking"] }
# ============ PDF 预览 (pdfium) ============
pdfium-render = "0.8"
# ============ PNG 编码 ============
png = "0.17"
# ============ 日志 ============
# ============ 打开外部链接（用 std::process::Command 原生实现，无额外依赖） ============

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true